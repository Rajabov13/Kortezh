# Готовый сайт лежит в папке site/ — сборка на Netlify не нужна.
# После правок в src/ выполните локально `npm install && npm run build` и закоммитьте site/index.html.
[build]
  publish = "site"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/draco/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
